name: Send Daily Schedule 2 Group

on:
  schedule:
    # Запуск каждый день в 4:00 UTC (7:00 по МСК/Минску)
    - cron: '0 4 * * *'
  workflow_dispatch: # Кнопка ручного запуска во вкладке Actions

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
